<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Login Screen</h2>
        <label for="username">Username</label>
           <input type="text" id="user" name="user" placeholder="Enter Username" required>
        <label for="email">Email</label>   
           <input type="email" id="ema" name="ema" placeholder="Enter Email" required>
        <label for="password">Password</label>
           <input type="password" id="pass" name="pass" placeholder="Enter Password" required>
           <input type="submit" value="Login">
    </form>
        <h2>Want to delete your data</h2>
    <button class="btn btn-danger" onclick="abrirModal()">Delete Acount</button>
    
    <div id="modalConfirmacao" class="modal">
        <div class="modal-content">
            <h3>Are you sure you want to delete your account?</h3>
            <p>This is irreversible.</p>
            <div class="buttons">
                <button class="btn btn-danger" onclick="confirmarExclusao()">Yes, delete</button>
                <button class="btn btn-cancel" onclick="fecharModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="editor-container">
        <div class="toolbar">
            <button id="undo" onclick="undoAction()">Undo</button>
            <button id="redo" onclick="redoAction()">Redo</button>
            <button id="clear" onclick="clearAction()">Clear</button>
    </div>
        <div contenteditable="true" class="editor" id="editor"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
